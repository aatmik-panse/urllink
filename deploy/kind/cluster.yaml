# Local single-node kind cluster. NodePorts are published on 127.0.0.1 only,
# so nothing is exposed beyond this machine.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: expenses
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080   # expenses app (Service type NodePort)
        hostPort: 8082
        listenAddress: 127.0.0.1
      - containerPort: 30300   # Grafana
        hostPort: 3002
        listenAddress: 127.0.0.1
      - containerPort: 30090   # Prometheus
        hostPort: 9092
        listenAddress: 127.0.0.1
      - containerPort: 30093   # Alertmanager
        hostPort: 9095
        listenAddress: 127.0.0.1
      - containerPort: 30686   # Jaeger UI
        hostPort: 16688
        listenAddress: 127.0.0.1
